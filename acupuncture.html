
<!DOCTYPE html>
<html>
<head>
    <title>Acupuncture-Therapy-Website-Design</title>
    <link rel="icon" type="image/png" href="emblem.png">
    <link rel="stylesheet" href="acupuncture.css">
</head>

<body>

    <section class="background">

        <img src="picture1.png" alt="Main background" class="profile1">

        <header class="main">
            <div class="mains">

                <div class="logos">
                    <img src="logo.png" alt="Lumina Logo">
                    <h1>Lumina</h1>
                </div>

                <nav>
                    <a href="#home">Home</a>
                    <a href="#About Me">About Me</a>
                    <a href="#services">Our Services</a>
                    <a href="#contact">Contact Me</a>
                </nav>

                <div class="buttn">
                    <button class="button3" type="button">
                        <img src="arrow.png" class="image1" alt="">
                        Book Now
                    </button>
                </div>

            </div>
        </header>

        <div class="background-content" id="home">

            <div class="text">

                <div class="reviews">

                    <div class="review-icons">
                        <img src="facebook.png" alt="Facebook" class="facebook">
                        <img src="blue.png" alt="Review" class="blue">
                        <img src="google.png" alt="Google" class="google">
                        <img src="red.png" alt="Review" class="red">
                        <img src="rate.png" alt="Rating" class="rate">
                    </div>

                    <div class="ratings">
                        <div class="stars">★★★★★</div>
                        <p>(5.0) Rating Review</p>
                    </div>

                </div>

                
                <h1>
                    Acupuncture Care<br>
                    For Natural Healing
                </h1>
                <div class="bttn">

                    <button class="button2" type="button">
                        <img src="arrow.png" class="image1" alt="">
                        Book A Consultation
                    </button>

                    <button class="button3" type="button">
                        <img src="phone.png" class="image1" alt="">
                        (877)511-8044
                    </button>

                </div>

            </div>

        </div>
        <form class="forms" id="contact">

            <h2>Ready To Feel Your Best?</h2>

            <div class="input-row">
                <input
                    type="text"
                    name="full-name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="tel"
                    name="phone"
                    placeholder="Phone Number"
                    required
                >
            </div>

            <div class="option">
                <select name="service" id="service-type" required>
                    <option value="" disabled selected hidden>
                        Service Type
                    </option>
            </div>

            <div>
                <textarea
                    name="message"
                    placeholder="Write your message"
                ></textarea>
            </div>

            <div class="buttons">
                <button class="button1" type="submit">
                    <img src="arrow.png" class="image1" alt="">
                    Book A Consultation
                </button>
            </div>

        </form>

    </section>

</body>
</html>
